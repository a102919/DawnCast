[project]
name = "dawncast-backend"
version = "0.1.0"
description = "DawnCast 後端：FastAPI 服務層 + 夜間批次生成引擎"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.28",
    "edge-tts>=7.2",
    "boto3>=1.35",
    "python-jose[cryptography]>=3.3",
    "numpy>=2.1",
    "opencc-python-reimplemented>=0.1.7",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "piper-tts",
    # Web Push：VAPID JWT 簽章 + RFC 8188 payload 加密。自己用 httpx 寫是 200 行
    # crypto，不划算。
    "pywebpush>=2.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "poethepoet>=0.32",
    "types-python-jose>=3.5.0.20260408",
]

[tool.poe.tasks]
lint = "ruff check ."
format = "ruff format ."
type-check = "mypy app engine shared"
test = "pytest"
export-openapi = "python -m scripts.export_openapi"

[tool.ruff]
line-length = 100
target-version = "py312"
# scripts/ 是單次執行的 utility（資料 backfill、批次翻譯），不參與部署也不該卡 production lint 訊號。
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

# pywebpush 沒有 py.typed / stubs（上游至今未提供）。只放行這個模組的 import，
# 其餘 strict 規則照舊；用 module override 而非在 shared/push.py 撒 ignore，
# 是為了讓 push.py 內部的型別檢查維持嚴格。
[[tool.mypy.overrides]]
module = ["pywebpush.*"]
ignore_missing_imports = true

# opencc-python-reimplemented 同樣沒有 py.typed / stubs。
[[tool.mypy.overrides]]
module = ["opencc.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "engine", "shared"]
