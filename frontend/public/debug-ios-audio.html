<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>iOS / Safari Audio 偵錯頁</title>
  <style>body{font-family:-apple-system,sans-serif;padding:20px;max-width:720px;margin:0 auto}button{padding:10px 16px;margin:6px;font-size:15px}pre{background:#111;color:#0f0;padding:12px;font-size:12px;overflow:auto;max-height:300px;border-radius:6px}hr{margin:24px 0;border:none;border-top:1px solid #ddd}</style>
</head>
<body>
  <h1>iOS / Safari Audio 偵錯</h1>
  <p>每按一個按鈕，把 console 結果（瀏覽器開發者工具 / Web Inspector）跟下方 pre 的內容一起回報給我。</p>

  <button id="btn-new-audio-tts">測 1：new Audio() + TTS（字卡走法）</button>
  <button id="btn-new-audio-r2">測 2：new Audio() + R2 集數 mp3 signed URL</button>
  <button id="btn-detached">測 3：new Audio() 不放進 DOM（detach 模式）</button>
  <button id="btn-attached">測 4：new Audio() 放進 DOM（attach 模式）</button>
  <button id="btn-unlock">測 5：silent WAV unlock 後再 play R2</button>
  <button id="btn-pause-race">測 6：silent WAV play 後**立刻 sync pause**（舊實作）</button>
  <button id="btn-then-pause">測 7：silent WAV play 後 .then() 才 pause（新實作）</button>
  <hr/>
  <pre id="out">(空)</pre>

  <script>
    const R2_KEY = 'episodes/017b7dc0-73b4-4cf3-be9b-4a58900c4c41/episode.mp3';
    const SILENT_WAV = 'data:audio/wav;base64,UklGRiwAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQgAAACAgICAgICAgA==';
    const out = document.getElementById('out');
    function log(...args) {
      const line = args.map(a => typeof a === 'object' ? JSON.stringify(a, (k,v) => v instanceof Error ? { name: v.name, message: v.message } : v, 2) : String(a)).join(' ');
      out.textContent += line + '\n';
      console.log('[debug]', ...args);
    }
    function clear() { out.textContent = ''; }
    function speakTTS(text) {
      if (!('speechSynthesis' in window)) { log('TTS: not supported'); return; }
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      speechSynthesis.speak(u);
      log('TTS: spoke', text);
    }

    async function fetchSignedUrl() {
      // prod R2 集數 mp3，2026-07-30T17:00 UTC 過期（2 小時）。
      return 'https://ff2cbc7b930c2124bbbc4885bbdf5a83.r2.cloudflarestorage.com/dawncast/episodes/017b7dc0-73b4-4cf3-be9b-4a58900c4c41/episode.mp3?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=cc8fcd48179706ff2642f812857163ab%2F20260730%2Fauto%2Fs3%2Faws4_request&X-Amz-Date=20260730T150008Z&X-Amz-Expires=7200&X-Amz-SignedHeaders=host&X-Amz-Signature=f5f7f64c8e34d6e947824b6cb84f037f31f8453435ead9e9b1e6893d901cf83d';
    }

    document.getElementById('btn-new-audio-tts').onclick = () => {
      clear();
      log('--- test 1: TTS only (vocab word card path) ---');
      speakTTS('hello world');
    };

    document.getElementById('btn-new-audio-r2').onclick = async () => {
      clear();
      log('--- test 2: new Audio() + R2 signed URL ---');
      try {
        const url = await fetchSignedUrl();
        log('URL:', url.slice(0, 100) + '...');
        const a = new Audio(url);
        a.addEventListener('error', e => log('error event', { code: a.error?.code, message: a.error?.message }));
        a.addEventListener('loadedmetadata', () => log('loadedmetadata, duration:', a.duration));
        a.addEventListener('canplay', () => log('canplay'));
        try {
          await a.play();
          log('play() resolved OK, paused:', a.paused);
        } catch (err) {
          log('play() REJECTED', { name: err.name, message: err.message });
        }
      } catch (err) {
        log('fetch URL failed', err.message);
      }
    };

    document.getElementById('btn-detached').onclick = async () => {
      clear();
      log('--- test 3: detached audio (NOT in DOM) ---');
      try {
        const url = await fetchSignedUrl();
        const a = new Audio(url);
        // 不 attach
        try { await a.play(); log('detached play() OK'); } catch (err) { log('detached play() REJECTED', err.name); }
      } catch (err) { log(err.message); }
    };

    document.getElementById('btn-attached').onclick = async () => {
      clear();
      log('--- test 4: attached audio (in hidden DOM host) ---');
      try {
        const url = await fetchSignedUrl();
        const a = new Audio(url);
        let host = document.querySelector('[data-debug-host]');
        if (!host) {
          host = document.createElement('div');
          host.setAttribute('data-debug-host', '');
          host.style.cssText = 'position:absolute;width:0;height:0;opacity:0;pointer-events:none;overflow:hidden;';
          document.body.appendChild(host);
        }
        host.appendChild(a);
        try { await a.play(); log('attached play() OK'); } catch (err) { log('attached play() REJECTED', err.name); }
      } catch (err) { log(err.message); }
    };

    document.getElementById('btn-unlock').onclick = async () => {
      clear();
      log('--- test 5: silent WAV unlock then R2 play ---');
      try {
        const unlock = new Audio(SILENT_WAV);
        document.body.appendChild(unlock);
        try { await unlock.play(); log('unlock play() OK'); unlock.pause(); } catch (err) { log('unlock REJECTED', err.name); }
        // 再播 R2
        const url = await fetchSignedUrl();
        const a = new Audio(url);
        document.body.appendChild(a);
        try { await a.play(); log('R2 play() after unlock OK'); } catch (err) { log('R2 play() REJECTED', err.name); }
      } catch (err) { log(err.message); }
    };

    document.getElementById('btn-pause-race').onclick = async () => {
      clear();
      log('--- test 6: silent WAV play then SYNC pause (old behavior) ---');
      const a = new Audio(SILENT_WAV);
      document.body.appendChild(a);
      try {
        const p = a.play();
        a.pause();  // sync pause 殺掉 promise
        await p;
        log('sync pause path resolved');
      } catch (err) {
        log('sync pause path REJECTED', { name: err.name, message: err.message });
      }
      // 再試 R2
      try {
        const url = await fetchSignedUrl();
        const r2 = new Audio(url);
        document.body.appendChild(r2);
        try { await r2.play(); log('R2 after sync-pause-unlock OK'); } catch (err) { log('R2 REJECTED', err.name); }
      } catch (err) { log(err.message); }
    };

    document.getElementById('btn-then-pause').onclick = async () => {
      clear();
      log('--- test 7: silent WAV play then .then() pause (new behavior) ---');
      const a = new Audio(SILENT_WAV);
      document.body.appendChild(a);
      try {
        await a.play();
        a.pause();
        log('then-pause path resolved');
      } catch (err) {
        log('then-pause path REJECTED', { name: err.name, message: err.message });
      }
      try {
        const url = await fetchSignedUrl();
        const r2 = new Audio(url);
        document.body.appendChild(r2);
        try { await r2.play(); log('R2 after then-pause-unlock OK'); } catch (err) { log('R2 REJECTED', err.name); }
      } catch (err) { log(err.message); }
    };
  </script>
</body>
</html>
