    <line x1="256" y1="65" x2="256" y2="92"/>
    <line x1="175" y1="98" x2="194" y2="117"/>
    <line x1="337" y1="98" x2="318" y2="117"/>
    <line x1="125" y1="175" x2="152" y2="183"/>
