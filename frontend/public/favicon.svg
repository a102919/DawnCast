    <line x1="235" y1="270" x2="235" y2="370"/>
    <line x1="265" y1="280" x2="265" y2="360"/>
    <line x1="295" y1="300" x2="295" y2="340"/>
    <line x1="325" y1="290" x2="325" y2="350"/>
    <line x1="355" y1="310" x2="355" y2="330"/>
  </g>
</svg>